[package]
name = "faculties-migrations"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "One-shot migrations for the current Faculties storage epoch."
authors = ["Jan-Paul Bultmann <jp@bultmann.eu>"]
homepage = "https://github.com/erlkonig-ai/faculties"
repository = "https://github.com/erlkonig-ai/faculties"

[lib]
path = "src/lib.rs"

# The one consumer. Every migration verb lives here, so the faculties
# themselves carry no migration surface at all.
[[bin]]
name = "migrations"
path = "src/bin/migrations.rs"

[dependencies]
anybytes = "0.20"
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive", "env"] }
ed25519-dalek = "2.1.1"
hex = "0.4"
triblespace = { version = "0.47", path = "../../triblespace-rs" }
# `triblespace::core::prelude::attributes!` expands to a `::triblespace_core`
# path, so a crate declaring a retired attribute needs the core crate by name.
triblespace-core = { path = "../../triblespace-rs/triblespace-core" }

# The schemas, catalog validators, and canonical models the transforms read.
# `default-features = false` keeps the migration path off the mary/GORBIE stack:
# nothing here needs embeddings, widgets, or audio.
faculties = { version = "0.20.2", path = "..", default-features = false }

[dev-dependencies]
tempfile = "3"
