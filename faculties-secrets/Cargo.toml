[package]
name = "faculties-secrets"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reusable capability and envelope-encryption core for the secrets faculty."
authors = ["Jan-Paul Bultmann <jp@bultmann.eu>"]
homepage = "https://github.com/erlkonig-ai/faculties"
repository = "https://github.com/erlkonig-ai/faculties"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
anybytes = "0.20"
dryoc = "0.8"           # secrets (libsodium-compatible pure-Rust crypto)
rand_core = "0.6.4"     # OsRng for key generation
triblespace = { version = "0.47", path = "../../triblespace-rs" }

[dev-dependencies]
ed25519-dalek = "2.1.1"
hifitime = "4.2.3"
tempfile = "3"
