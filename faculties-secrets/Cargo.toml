[package]
name = "faculties-secrets"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Per-version encrypted secrets for capability-governed TribleSpace collections."
authors = ["Jan-Paul Bultmann <jp@bultmann.eu>"]
homepage = "https://github.com/erlkonig-ai/faculties"
repository = "https://github.com/erlkonig-ai/faculties"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
anybytes = "0.20"
dryoc = "0.8"           # secrets (libsodium-compatible pure-Rust crypto)
# DEKs are sealed to admitted readers' durable pile signing keys, so the core
# uses the same Ed25519 type the signing-key file yields.
ed25519-dalek = "2.1.1"
hifitime = "4.2.3"
triblespace = { version = "0.47", path = "../../triblespace-rs" }
zeroize = "1.9"

[dev-dependencies]
pollster = "0.4"
rand_core = "0.6.4"
tempfile = "3"
